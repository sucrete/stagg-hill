<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sign in to the Stagg Hill Golf Club members area."
    />
    <link
      rel="shortcut icon"
      type="image/x-icon"
      href="assets/images/fav.png"
    />
    <title>Member Login</title>
    <link
      rel="stylesheet preload"
      href="assets/css/vendor/bootstrap.min.css"
      as="style"
      media="print"
      onload="this.media='all'"
    />

    <link rel="stylesheet preload" href="css/style.css" as="style" />

    <style>
      body {
        background: #f5f5f3;
      }
      .member-login-page {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
      }
      .member-login-logo {
        display: inline-block;
        margin-bottom: 40px;
      }
      .member-login-logo img {
        height: 56px;
        width: auto;
      }
      .member-login-card {
        width: 100%;
        max-width: 460px;
        background: #fff;
        border-radius: 12px;
        padding: 48px 40px;
        box-shadow: rgba(0, 0, 0, 0.18) 0px 2px 4px;
      }
      .member-login-card .title {
        font-size: 32px;
        margin-bottom: 12px;
      }
      .member-login-message {
        margin-top: 20px;
        font-weight: 500;
      }
      .member-login-message.is-error {
        color: #c0392b;
      }
      .member-login-card .rts-btn {
        width: 100%;
        max-width: 100%;
      }
    </style>

    <script src="assets/js/fetchData.js"></script>
  </head>

  <body>
    <div class="member-login-page">
      <a href="index.html" class="member-login-logo">
        <img
          src="assets/images/logo/stagg-logo.svg"
          alt="Stagg Hill Golf Club"
        />
      </a>

      <div class="member-login-card">
        <div class="section-title text-center mb--0">
          <h2 class="title" id="member-login-title">Member Login</h2>
          <p
            id="member-login-subtitle"
            style="font-size: 14px; line-height: 1.3; margin-top: 10px"
          >
            Enter your email and password to access the members area.
          </p>
        </div>

        <!-- Traditional email + password login (default view) -->
        <form
          class="contact-form"
          id="password-login-form"
          style="margin-top: 20px"
        >
          <div class="inputs-wrapper">
            <div class="single">
              <label for="login-email">Email</label>
              <input
                type="email"
                id="login-email"
                name="email"
                autocomplete="username"
                required
              />
            </div>
            <div class="single">
              <label for="login-password">Password</label>
              <input
                type="password"
                id="login-password"
                name="password"
                autocomplete="current-password"
                required
              />
            </div>
            <button
              id="password-login-submit"
              type="submit"
              class="rts-btn btn-primary"
            >
              <span class="button-text">Log In</span>
            </button>
          </div>
        </form>
        <p
          id="request-link-toggle"
          style="margin-top: 16px; font-size: 13px; text-align: center; margin-bottom: 1rem;"
        >
          <a href="#" id="show-request-link"
            >Forgot your password, or logging in for the first time?</a
          >
        </p>

        <!-- Branching choice: first-time setup vs. forgotten password -->
        <div id="choice-view" style="margin-top: 20px" hidden>
          <div class="inputs-wrapper" style="gap: 12px; display: flex; flex-direction: column;">
            <button
              id="choice-first-time"
              type="button"
              class="rts-btn btn-primary"
            >
              <span class="button-text">Logging in for the first time</span>
            </button>
            <button
              id="choice-forgot-password"
              type="button"
              class="rts-btn btn-primary"
            >
              <span class="button-text">Forgot my password</span>
            </button>
          </div>
          <p style="margin-top: 16px; font-size: 13px; text-align: center">
            <a href="#" id="show-password-login-from-choice">Back to log in</a>
          </p>
        </div>

        <!-- Request a one-time email link: first-time setup or forgotten password -->
        <form
          class="contact-form"
          id="member-login-form"
          style="margin-top: 20px"
          hidden
        >
          <div class="inputs-wrapper">
            <div class="single">
              <label for="member-login-email">Email</label>
              <input
                type="email"
                id="member-login-email"
                name="email"
                autocomplete="username"
                required
              />
            </div>
            <button
              id="member-login-submit"
              type="submit"
              class="rts-btn btn-primary"
            >
              <span class="button-text">Email me a login link</span>
            </button>
          </div>
        </form>
        <p
          id="back-to-password-login"
          style="margin-top: 16px; font-size: 13px; text-align: center"
          hidden
        >
          <a href="#" id="show-password-login">Back to log in</a>
        </p>

        <!-- Shown instead of sending a link, when the "first time" path detects
             the email is already registered with a password -->
        <div id="already-registered-view" style="margin-top: 20px" hidden>
          <p style="font-size: 14px; line-height: 1.3;">
            That email is already registered. You can go back to log in, or
            reset your password instead.
          </p>
          <div class="inputs-wrapper" style="gap: 12px; display: flex; flex-direction: column; margin-top: 16px;">
            <button
              id="already-registered-reset"
              type="button"
              class="rts-btn btn-primary"
            >
              <span class="button-text">Reset your password</span>
            </button>
            <button
              id="already-registered-back"
              type="button"
              class="rts-btn btn-border"
              style="color: var(--color-body); justify-content: center;"
            >
              <span class="button-text">Back to log in</span>
            </button>
          </div>
        </div>

        <!-- Set/reset a password, shown after confirming identity via the emailed link -->
        <form
          class="contact-form"
          id="set-password-form"
          style="margin-top: 20px"
          hidden
        >
          <div class="inputs-wrapper">
            <div class="single">
              <label for="new-password">New password</label>
              <input
                type="password"
                id="new-password"
                name="new-password"
                autocomplete="new-password"
                minlength="8"
                required
              />
            </div>
            <div class="single">
              <label for="confirm-password">Confirm password</label>
              <input
                type="password"
                id="confirm-password"
                name="confirm-password"
                autocomplete="new-password"
                minlength="8"
                required
              />
            </div>
            <button
              id="set-password-submit"
              type="submit"
              class="rts-btn btn-primary"
            >
              <span class="button-text">Save password</span>
            </button>
          </div>
        </form>

        <p id="member-login-message" class="member-login-message" hidden></p>
      </div>
    </div>

    <script type="module" src="assets/js/memberLogin.js"></script>
    <script defer src="assets/js/rippleEffect.js"></script>
  </body>
</html>
