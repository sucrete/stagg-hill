<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sign in to the Stagg Hill Golf Club members area."
    />
    <link
      rel="shortcut icon"
      type="image/x-icon"
      href="assets/images/fav.png"
    />
    <title>Member Login</title>
    <link
      rel="stylesheet preload"
      href="assets/css/vendor/bootstrap.min.css"
      as="style"
      media="print"
      onload="this.media='all'"
    />

    <link rel="stylesheet preload" href="css/style.css" as="style" />

    <style>
      body {
        background: #f5f5f3;
      }
      .member-login-page {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
      }
      .member-login-logo {
        display: inline-block;
        margin-bottom: 40px;
      }
      .member-login-logo img {
        height: 56px;
        width: auto;
      }
      .member-login-card {
        width: 100%;
        max-width: 460px;
        background: #fff;
        border-radius: 12px;
        padding: 48px 40px;
        box-shadow: rgba(0, 0, 0, 0.18) 0px 2px 4px;
      }
      .member-login-card .title {
        font-size: 32px;
        margin-bottom: 12px;
      }
      .member-login-message {
        margin-top: 20px;
        font-weight: 500;
      }
      .member-login-message.is-error {
        color: #c0392b;
      }
    </style>

    <script src="assets/js/fetchData.js"></script>
  </head>

  <body>
    <div class="member-login-page">
      <a href="index.html" class="member-login-logo">
        <img
          src="assets/images/logo/stagg-logo.svg"
          alt="Stagg Hill Golf Club"
        />
      </a>

      <div class="member-login-card">
        <div class="section-title text-center mb--0">
          <h2 class="title">Member Login</h2>
          <p style="font-size: 14px; line-height: 1.3; margin-top: 10px">
            Enter the email on file with your membership and we'll send
            you a link to sign in — no password needed.
          </p>
        </div>
        <form class="contact-form" id="member-login-form" style="margin-top: 20px">
          <div class="inputs-wrapper">
            <div class="single">
              <label for="member-login-email">Email</label>
              <input
                type="email"
                id="member-login-email"
                name="email"
                required
              />
            </div>
            <button
              id="member-login-submit"
              type="submit"
              class="rts-btn btn-primary"
            >
              <span class="button-text">Send sign-in link</span>
            </button>
          </div>
        </form>
        <p id="member-login-message" class="member-login-message" hidden></p>
      </div>
    </div>

    <script type="module" src="assets/js/memberLogin.js"></script>
  </body>
</html>
